<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efeee9" />
    <meta name="description" content="Keep your income, expenses, and savings in one clear view with MoneyMinder." />
    <meta property="og:title" content="MoneyMinder" />
    <meta property="og:description" content="A clear view of your income, expenses, and savings." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>MoneyMinder</title>
    <style>
      .boot { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 12px; background: #efeee9; color: #141414; font: 700 14px Inter, system-ui, sans-serif; }
      .boot-mark { display: flex; align-items: end; gap: 4px; height: 28px; }
      .boot-mark i { width: 7px; border-radius: 3px; background: #141414; transform-origin: bottom; animation: boot-rise 700ms ease-in-out infinite alternate; }
      .boot-mark i:nth-child(1) { height: 12px; animation-delay: 0ms; }
      .boot-mark i:nth-child(2) { height: 20px; background: #c4f04d; animation-delay: 100ms; }
      .boot-mark i:nth-child(3) { height: 28px; animation-delay: 200ms; }
      @keyframes boot-rise { to { transform: scaleY(.65); opacity: .7; } }
      @media (prefers-reduced-motion: reduce) { .boot-mark i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading MoneyMinder">
        <span class="boot-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>MoneyMinder</span>
      </div>
    </div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
